name: Composer release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version without v (for example, 0.3.1)"
        required: true
        type: string
      publish:
        description: "Publish verified kern-core and kern-cms distributions"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: composer-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, mbstring, dom, fileinfo, intl, zip, gd, exif, bcmath
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Build and package both distributions
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          npm ci --no-audit
          node --test tests/ReleasePackage.test.mjs tests/CorePackage.test.mjs tests/UpgraderPackage.test.mjs
          npm run build
          npm run test:assets
          bash scripts/build-release.sh "$RELEASE_VERSION" "$RUNNER_TEMP/kern-release" "$RUNNER_TEMP/kern-artifacts"
      - name: Verify new installations and upgrade from the published 0.1.0
        run: bash scripts/test-release.sh "$RELEASE_VERSION" "$RUNNER_TEMP/kern-artifacts"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: composer-release
          path: ${{ runner.temp }}/kern-artifacts/
          retention-days: 14

  publish:
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name composer-release --dir "$RUNNER_TEMP/kern-artifacts"
          cd "$RUNNER_TEMP/kern-artifacts"
          sha256sum --check SHA256SUMS
      - name: Publish kern-core first
        env:
          GH_TOKEN: ${{ secrets.CORE_RELEASE_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'Set CORE_RELEASE_TOKEN with Contents write access to binhtq1/kern-core.' >&2
            exit 1
          fi
          bash scripts/publish-release.sh kern-core "$RELEASE_VERSION" "$RUNNER_TEMP/kern-artifacts"
      - name: Wait for the runtime to be available on Packagist
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent https://repo.packagist.org/p2/binhtq1/kern-core.json | jq -e --arg version "$RELEASE_VERSION" '.packages["binhtq1/kern-core"][] | select(.version == $version or .version == ("v" + $version))' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'kern-core is not indexed yet. Register/refresh binhtq1/kern-core on Packagist, then rerun the failed publish job.' >&2
          exit 1
      - name: Publish kern-cms starter
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh kern-cms "$RELEASE_VERSION" "$RUNNER_TEMP/kern-artifacts"
